<style>
  .gate { max-width: 460px; margin: 0 auto; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 44px 36px; text-align: center; }
  .gate h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .gate p { color: var(--charcoal); opacity: .8; }
  .gate form { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .gate input { flex: 1 1 200px; padding: 15px 20px; border-radius: 999px; border: 1.5px solid var(--coral-pale); font: inherit; background: var(--cream-light); color: var(--charcoal); }
  .gate input:focus { outline: none; border-color: var(--coral); }
  .gate-msg { margin-top: 16px; min-height: 1.4em; color: var(--ink); font-weight: 500; }
  #debrief { display: none; }
  #debrief .story-copy { padding-bottom: 20px; }
  #debrief h2 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 6px 0 18px; }
  #debrief h3 { font-size: 1.4rem; margin: 46px 0 14px; }
  #debrief .story-inline-img { margin: 34px auto; }
  #debrief .story-inline-img img { border-radius: var(--radius-lg); box-shadow: var(--shadow); max-width: min(420px, 100%); margin: 0 auto; }
  #debrief .meta { font-size: .95rem; opacity: .75; }
  #debrief .eyebrow { display: block; }
  #debrief .spoiler-flag { margin-bottom: 14px; }
  #debrief .spoiler-flag { display: inline-block; padding: 8px 18px; border-radius: 999px; background: var(--ink); color: var(--white); font-weight: 600; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; opacity: 1; margin-bottom: 26px; }
  #debrief .letter { background: var(--white); border-left: 4px solid var(--coral); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); margin: 18px 0; padding: 22px 28px; font-family: var(--serif); }
  #debrief .letter p { font-size: 1rem; margin-bottom: 12px; }
  #debrief .table-wrap { overflow-x: auto; margin: 18px 0 26px; }
  #debrief .board { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-soft); font-size: .98rem; }
  #debrief .board th, #debrief .board td { padding: 9px 14px; text-align: right; }
  #debrief .board th { background: var(--cream-deep); color: var(--ink); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
  #debrief .board td:nth-child(odd), #debrief .board th:nth-child(odd) { text-align: left; }
  #debrief .board.plain th, #debrief .board.plain td { text-align: left; }
  #debrief .board tbody tr:nth-child(even) { background: var(--cream-light); }
  #debrief a { color: var(--ink); text-decoration: underline; }
</style>

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function unlock(password) {
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(PAYLOAD.s), iterations: PAYLOAD.i, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.v) }, key, b64(PAYLOAD.c));
    return new TextDecoder().decode(pt);
  }

  document.getElementById("gate-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var msg = document.getElementById("gate-msg");
    var pw = document.getElementById("pw").value.trim().toLowerCase();
    if (!pw) { msg.textContent = "Please enter the password."; return; }
    msg.textContent = "Checking...";
    try {
      var html = await unlock(pw);
      var out = document.getElementById("debrief");
      out.innerHTML = '<div class="story-copy">' + html + "</div>";
      document.getElementById("gate").style.display = "none";
      out.style.display = "block";
      window.scrollTo(0, 0);
    } catch (err) {
      msg.textContent = "That password isn't right. Check your confirmation email and try again.";
    }
  });
